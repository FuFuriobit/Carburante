<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Portfolio Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #1a252f; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eef2f5; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        .pos { color: #10b981; font-weight: bold; }
        .neg { color: #ef4444; font-weight: bold; }
        .card { background: #e0f2fe; border-left: 4px solid #0284c7; padding: 15px; margin-bottom: 20px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        input[type="number"] { width: 80px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 Monitoraggio Portafoglio ETF</h1>
    <div class="card">
        <span id="last-update">Caricamento dati in corso...</span>
        <button class="btn" onclick="salvaEModifica()">💾 Salva Modifiche</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ISIN / Nome</th>
                <th>Prezzo</th>
                <th>Quote</th>
                <th>PMC (€)</th>
                <th>Valore Totale</th>
                <th>P&L (€)</th>
                <th>Var. Giornaliera</th>
            </tr>
        </thead>
        <tbody id="portfolio-body">
            <!-- Dati caricati dinamicamente -->
        </tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
